broker = "tradovate"
env = "sim"
auth_mode = "token_file"
log_mode = "default"
session_stats_enabled = true

token_override = ""
username = ""
password = ""
api_key = ""
app_id = "Trader"
app_version = "0.1.0"
cid = ""
secret = ""
custom_tag50 = ""

token_path = ".auth/bearer-token.json"
session_cache_path = ".auth/trader-session.json"

history_bars = 500
heartbeat_ms = 2500
contract_suggest_limit = 12
time_in_force = "Day"
order_qty = 1
candle_mode = "standard"
autoconnect = false
replay_file_path = "trader/market replay/ES 06-26.Last.txt"
# Optional JSONL full-book snapshots for replay_fill_model = "dom".
# Each line: {"ts_ns": 0, "bids": [{"price": 1.0, "size": 1.0}], "asks": [{"price": 1.25, "size": 1.0}]}
# replay_dom_file_path = "trader/market replay/ES 06-26.dom.jsonl"
replay_initial_capital = 100000.0
replay_account_currency = "USD"
replay_margin_model = "fixed_per_contract"
# Zero disables automatic margin analysis in saved replay results.
replay_margin_per_contract = 0.0
replay_safety_buffer = 0.0
replay_safety_buffer_percent = 0.0
# Optional post-exit continuation window in selected replay bars; zero disables it.
replay_post_exit_continuation_bars = 0
# Optional structured per-bar strategy diagnostics (signals.csv) for replay runs.
replay_signal_diagnostics = false
replay_bar_interval_ms = 5
replay_engine_mode = "legacy"
replay_fill_model = "raw_bar_open"
replay_latency_model = "fixed"
replay_fixed_latency_ms = 0
replay_observed_latency_ms = []
replay_latency_seed = 1
replay_bar_protection_policy = "conservative"

# Set this only when a local `trader-replay-proxy` is running.  Live mode
# rejects this block, and only loopback URLs are accepted.
[simulation_proxy]
enabled = false
rest_url = "http://127.0.0.1:18100/v1"
user_ws_url = "ws://127.0.0.1:18101/v1/websocket"
market_ws_url = "ws://127.0.0.1:18102/v1/websocket"
